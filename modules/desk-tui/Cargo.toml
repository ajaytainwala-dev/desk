[package]
name = "desk-tui"
version = "0.1.0"
edition = "2024"
description = "Cross-Platform TUI Code Editor for Desk"
authors = ["Desk Team"]

[[bin]]
name = "desk"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
toml = "0.8"
dirs = "5.0"
unicode-width = "0.2"
crossbeam-channel = "0.5"
once_cell = "1.19"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
