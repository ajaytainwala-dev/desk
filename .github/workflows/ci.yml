name: CI

# Only Java / Rust / packaging / CI plumbing — not website, docs, or unrelated edits.
on:
  push:
    branches: ['**']
    paths:
      - 'modules/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - 'packaging/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/native-build.yml'
      - '.github/scripts/**'
  pull_request:
    branches: ['**']
    paths:
      - 'modules/**'
      - 'pom.xml'
      - 'mvnw'
      - 'mvnw.cmd'
      - '.mvn/**'
      - 'packaging/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/native-build.yml'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate & structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Maven Wrapper
        run: |
          test -f mvnw && test -f mvnw.cmd
          test -f .mvn/maven-wrapper.jar && test -f .mvn/maven-wrapper.properties
          echo "Maven Wrapper is present"
      - name: Validate project structure
        run: |
          test -f pom.xml
          test -d modules/desk-core
          test -d modules/desk-cli
          test -d modules/desk-tui
          echo "Project structure is valid"

  build:
    name: Build & test
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Maven Wrapper
        run: bash mvnw -v
      - name: Compile all modules
        run: bash mvnw -q -B compile
      - name: Run unit tests
        run: bash mvnw -B test
      - name: Package
        run: bash .github/scripts/mvnw-retry.sh -B -DskipTests package
      - name: Stage CLI uber JAR for portable packaging
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p staging/cli-jar
          UBER_JAR=$(ls modules/desk-cli/target/desk-cli-*.jar | grep -v original | head -1)
          cp "$UBER_JAR" "staging/cli-jar/$(basename "$UBER_JAR")"
      - name: Upload CLI uber JAR
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: desk-cli-uber-jar
          path: staging/cli-jar/*
          retention-days: 7
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: modules/*/target/surefire-reports/**
          retention-days: 7

  static-analysis:
    name: Static analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile with warnings
        run: bash mvnw -B -Pstrict-warnings compile
      - name: Dependency inventory (informational)
        run: |
          bash mvnw -B -q dependency:tree -Dverbose=false | tee dependency-tree.txt | tail -n 40
          echo "For vulnerability alerts, enable GitHub Dependabot on this repository."

  rust-build:
    name: Build Rust TUI editor
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust compile artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/desk-tui -> target
          shared-key: desk-tui-${{ matrix.os }}
          cache-on-failure: true
      - name: Check formatting
        working-directory: modules/desk-tui
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: modules/desk-tui
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: modules/desk-tui
        run: cargo test
      - name: Build Rust editor (release)
        working-directory: modules/desk-tui
        run: cargo build --release
      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: desk-tui-${{ matrix.os }}
          path: modules/desk-tui/target/release/desk*
          retention-days: 30

  jdtls-it:
    name: Live JDT LS integration
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Provision pinned JDT LS
        id: jdtls
        run: |
          ROOT="${RUNNER_TEMP}/desk-jdtls"
          bash .github/scripts/provision-jdtls.sh "$ROOT"
          echo "launcher=$ROOT/bin/jdtls" >> "$GITHUB_OUTPUT"
          test -x "$ROOT/bin/jdtls"
      - name: Run live JDT LS tests (must not skip)
        env:
          DESK_JDTLS_CI: "1"
          DESK_JAVA_LS: ${{ steps.jdtls.outputs.launcher }}
          DESK_LSP_LOG: "1"
        run: |
          bash mvnw -B -pl modules/desk-java -am test -Dtest=LiveJdtLsIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false
          # Fail if the live test was skipped despite DESK_JDTLS_CI
          REPORT=modules/desk-java/target/surefire-reports/desk.java.lsp.LiveJdtLsIntegrationTest.txt
          test -f "$REPORT"
          ! grep -q 'Tests run: 1, Failures: 0, Errors: 0, Skipped: 1' "$REPORT"
          grep -q 'Tests run: 1, Failures: 0, Errors: 0, Skipped: 0' "$REPORT"

  jdi-debug-it:
    name: JDI debug E2E
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run JDI debugger E2E
        run: bash mvnw -B -pl modules/desk-java -am test -Dtest=JdiDebuggerE2ETest -Dsurefire.failIfNoSpecifiedTests=false

  package:
    name: Package (jlink portable)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Download packaged CLI JAR
        uses: actions/download-artifact@v4
        with:
          name: desk-cli-uber-jar
          path: modules/desk-cli/target
      - name: Build jlink portable distribution
        env:
          DESK_SKIP_MVN: "1"
        run: bash packaging/jlink/build-jlink.sh dist/desk-portable
      - name: Upload portable distribution
        uses: actions/upload-artifact@v4
        with:
          name: desk-portable-${{ github.run_id }}
          path: dist/desk-portable/**
          retention-days: 30
