name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate & structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Maven Wrapper
        run: |
          test -f mvnw && test -f mvnw.cmd
          test -f .mvn/maven-wrapper.jar && test -f .mvn/maven-wrapper.properties
          echo "Maven Wrapper is present"
      - name: Validate project structure
        run: |
          test -f pom.xml
          test -d modules/devkit-core
          test -d modules/devkit-cli
          test -d modules/devkit-editor-rs
          echo "Project structure is valid"

  build:
    name: Build & test
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: Verify Maven Wrapper
        run: bash mvnw -v
      - name: Compile all modules
        run: bash mvnw -q -B compile
      - name: Run unit tests
        run: bash mvnw -B test
      - name: Package
        run: bash mvnw -B -DskipTests package
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: modules/*/target/surefire-reports/**
          retention-days: 7

  static-analysis:
    name: Static analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: Compile with warnings
        run: bash mvnw -B -Pstrict-warnings compile
      - name: Check dependency vulnerabilities (informational)
        run: |
          echo "Dependency vulnerability scan would run here (requires a configured tool)."
          echo "This step is a placeholder until a scanning tool is selected."

  rust-build:
    name: Build Rust TUI editor
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        working-directory: modules/devkit-editor-rs
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: modules/devkit-editor-rs
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: modules/devkit-editor-rs
        run: cargo test
      - name: Build Rust editor (release)
        working-directory: modules/devkit-editor-rs
        run: cargo build --release
      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: devkit-editor-rs-${{ matrix.os }}
          path: modules/devkit-editor-rs/target/release/devkit-editor-rs*
          retention-days: 30

  package:
    name: Package (jlink portable)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: Build all modules
        run: bash mvnw -B -DskipTests package
      - name: Build jlink portable distribution
        run: bash packaging/jlink/build-jlink.sh dist/devkit-portable
      - name: Upload portable distribution
        uses: actions/upload-artifact@v4
        with:
          name: devkit-portable-${{ github.run_id }}
          path: dist/devkit-portable/**
          retention-days: 30
