name: Native Image Build

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate tag format
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Manual run or non-tag event; skipping tag validation."
            exit 0
          fi
          TAG=${GITHUB_REF#refs/tags/}
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$TAG' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "Tag version: $TAG"

  build:
    name: Build Native Image
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK (GraalVM)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Install native-image component
        run: |
          if command -v native-image >/dev/null 2>&1; then
            native-image --version
          else
            gu install native-image || true
            native-image --version
          fi
      - name: Build all modules
        run: bash .github/scripts/mvnw-retry.sh -B -DskipTests package
      - name: Build native image (Unix)
        if: runner.os != 'Windows'
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: bash packaging/native-image/build-native.sh desk
      - name: Build native image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: ./packaging/native-image/build-native.ps1 desk
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: desk-native-${{ matrix.os }}
          path: dist/native/desk*
          retention-days: 30
