name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver without v prefix (e.g. 0.1.0). Creates GitHub release v{version}.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: tag '$TAG' does not match vMAJOR.MINOR.PATCH"
              exit 1
            fi
            VERSION=${TAG#v}
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: version '$VERSION' does not match MAJOR.MINOR.PATCH"
              exit 1
            fi
            TAG="v${VERSION}"
          else
            VERSION=$(grep -m1 '<version>' pom.xml | head -1 | sed 's/.*<version>\([^<]*\)<\/version>.*/\1/' | tr -d ' ' | sed 's/-SNAPSHOT$//')
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (tag $TAG)"

  # GraalVM native builds are optional — failure must not block the GitHub Release.
  build-native:
    name: Build native artifacts
    needs: validate
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: desk-native-linux
          - os: windows-latest
            asset: desk-native-windows.exe
          - os: macos-latest
            asset: desk-native-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK (GraalVM)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Install native-image component
        run: |
          if command -v native-image >/dev/null 2>&1; then
            native-image --version
          else
            gu install native-image || true
            native-image --version
          fi
      - name: Build all modules
        run: bash .github/scripts/mvnw-retry.sh -B -DskipTests package
      - name: Build native image (Unix)
        if: runner.os != 'Windows'
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: bash packaging/native-image/build-native.sh desk
      - name: Build native image (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GRAALVM_HOME: ${{ env.JAVA_HOME }}
        run: ./packaging/native-image/build-native.ps1 desk
      - name: Stage stable-named asset
        run: |
          mkdir -p dist/upload
          src=$(ls dist/native/desk* 2>/dev/null | head -1 || true)
          if [ -z "$src" ]; then
            echo "No native binary produced" >&2
            exit 1
          fi
          cp "$src" "dist/upload/${{ matrix.asset }}"
          ls -lh dist/upload/
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: desk-native-${{ matrix.os }}
          path: dist/upload/*
          retention-days: 90

  build-portable:
    name: Build portable zip
    needs: [validate, build-rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            tui_artifact: desk-tui-ubuntu-latest
          - os: macos-latest
            platform: macos
            tui_artifact: desk-tui-macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Download platform TUI binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.tui_artifact }}
          path: dist/tui
      - name: Build jlink portable distribution
        run: |
          TUI=$(ls dist/tui/desk-tui-* 2>/dev/null | head -1 || true)
          if [ -z "$TUI" ]; then
            echo "Error: TUI artifact missing for ${{ matrix.platform }}" >&2
            exit 1
          fi
          DESK_TUI_BINARY="$TUI" bash packaging/jlink/build-jlink.sh dist/desk-portable
          test -x dist/desk-portable/bin/desk-tui
      - name: Zip portable distribution
        run: |
          chmod +x packaging/installers/build-portable-zip.sh
          DESK_ZIP_PLATFORM=${{ matrix.platform }} bash packaging/installers/build-portable-zip.sh \
            dist/desk-portable \
            dist/desk-portable-${{ matrix.platform }}.zip
          if [ "${{ matrix.platform }}" = "linux" ]; then
            cp dist/desk-portable-linux.zip dist/desk-portable.zip
          fi
      - name: Upload portable zips
        uses: actions/upload-artifact@v4
        with:
          name: desk-portable-${{ matrix.platform }}
          path: dist/desk-portable-*.zip
          if-no-files-found: error
          retention-days: 90

  build-rust:
    name: Build Rust TUI editor
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: desk-tui-linux
          - os: windows-latest
            asset: desk-tui-windows.exe
          - os: macos-latest
            asset: desk-tui-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust compile artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: modules/desk-tui -> target
          shared-key: desk-tui-release-${{ matrix.os }}
          cache-on-failure: true
      - name: Build Rust editor (release)
        working-directory: modules/desk-tui
        run: cargo build --release
      - name: Stage stable-named asset
        shell: bash
        run: |
          mkdir -p dist/upload
          if [ -f modules/desk-tui/target/release/desk.exe ]; then
            cp modules/desk-tui/target/release/desk.exe "dist/upload/${{ matrix.asset }}"
          else
            cp modules/desk-tui/target/release/desk "dist/upload/${{ matrix.asset }}"
          fi
          ls -lh dist/upload/
      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: desk-tui-${{ matrix.os }}
          path: dist/upload/*
          if-no-files-found: error
          retention-days: 90

  build-windows-installer:
    name: Build Windows GUI + portable zip
    needs: [validate, build-rust]
    # Optional: publish core assets even if NSIS/GUI packaging fails.
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Download Windows TUI binary
        uses: actions/download-artifact@v4
        with:
          name: desk-tui-windows-latest
          path: dist/tui
      - name: Build jlink portable (Windows)
        shell: pwsh
        run: |
          $tui = Get-ChildItem dist/tui -Filter *.exe | Select-Object -First 1
          if (-not $tui) { throw "Windows TUI binary missing" }
          $env:DESK_TUI_BINARY = $tui.FullName
          ./packaging/jlink/build-jlink.ps1 dist/desk-portable
          if (-not (Test-Path dist/desk-portable/bin/desk-tui.exe)) {
            throw "desk-tui.exe was not bundled into portable layout"
          }
      - name: Zip Windows portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/desk-portable-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # Windows runners do not ship Info-ZIP; use tar's zip writer instead.
          tar -a -cf $zip -C dist desk-portable
          Get-Item $zip | Format-List FullName, Length
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build GUI installer
        shell: pwsh
        run: |
          $tui = Get-ChildItem dist/tui -Filter *.exe | Select-Object -First 1
          if (-not $tui) { throw "Windows TUI binary missing" }
          ./packaging/installers/build-windows-installer.ps1 `
            -Version "${{ needs.validate.outputs.version }}" `
            -PortableDir "dist/desk-portable" `
            -NativeExe $tui.FullName `
            -OutDir "dist"
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: desk-windows-installers
          path: |
            dist/Desk-Setup-*.exe
            dist/desk-portable-windows.zip
          if-no-files-found: error
          retention-days: 90

  package-cli-setup:
    name: Package CLI setup scripts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Stage setup scripts with stable names
        run: |
          mkdir -p dist/cli-setup
          cp packaging/installers/desk-cli-setup.sh dist/cli-setup/desk-cli-setup.sh
          cp packaging/installers/desk-cli-setup-windows.ps1 dist/cli-setup/desk-cli-setup-windows.ps1
          chmod +x dist/cli-setup/desk-cli-setup.sh
      - name: Upload CLI setup scripts
        uses: actions/upload-artifact@v4
        with:
          name: desk-cli-setup
          path: dist/cli-setup/*
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub release
    # Publish whenever a tag is pushed or workflow_dispatch runs — even if optional native jobs fail.
    if: |
      always()
      && needs.validate.result == 'success'
      && needs.build-portable.result == 'success'
      && needs.build-rust.result == 'success'
      && needs.package-cli-setup.result == 'success'
      && (needs.build-windows-installer.result == 'success' || needs.build-windows-installer.result == 'failure')
      && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    needs:
      - validate
      - build-native
      - build-portable
      - build-rust
      - build-windows-installer
      - package-cli-setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all available artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
          merge-multiple: false
      - name: Flatten release assets
        run: |
          mkdir -p dist/release
          if [ ! -d dist/artifacts ] || [ -z "$(find dist/artifacts -type f 2>/dev/null | head -1)" ]; then
            echo "Error: no artifacts downloaded — cannot publish release" >&2
            exit 1
          fi
          find dist/artifacts -type f -print0 | while IFS= read -r -d '' f; do
            base=$(basename "$f")
            dest="dist/release/$base"
            if [ -e "$dest" ]; then
              dest="dist/release/$(basename "$(dirname "$f")")-$base"
            fi
            cp "$f" "$dest"
          done
          cd dist/release
          find . -type f ! -name '*.sha256' -print0 | while IFS= read -r -d '' f; do
            sha256sum "$f" > "${f}.sha256"
          done
          echo "=== Release assets ==="
          ls -lah
          count=$(find . -type f ! -name '*.sha256' | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "Error: empty release asset set" >&2
            exit 1
          fi
      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          mapfile -t ASSETS < <(find dist/release -type f ! -name '*.sha256' | sort)
          if [ "${#ASSETS[@]}" -lt 1 ]; then
            echo "Error: no release assets to publish" >&2
            exit 1
          fi

          # Also attach checksums when present.
          mapfile -t CHECKSUMS < <(find dist/release -type f -name '*.sha256' | sort || true)
          ALL_FILES=("${ASSETS[@]}" "${CHECKSUMS[@]}")

          NOTES_FILE=$(mktemp)
          cat > "$NOTES_FILE" <<EOF
          ## Downloads

          Website buttons always resolve **this latest release**.

          | Asset | Use |
          |-------|-----|
          | \`Desk-Setup-*.exe\` | Windows GUI installer |
          | \`desk-cli-setup-windows.ps1\` | Windows CLI setup |
          | \`desk-cli-setup.sh\` | macOS / Linux CLI setup |
          | \`desk-portable-*.zip\` | Portable zip (unzip & run) |
          | \`desk-tui-*\` | Desk TUI editor (Rust) binary |
          | \`desk-native-*\` | GraalVM native binary (when available) |

          ### Quick install

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/desk-cli-setup.sh | bash
          \`\`\`

          \`\`\`powershell
          irm https://github.com/${{ github.repository }}/releases/latest/download/desk-cli-setup-windows.ps1 | iex
          \`\`\`

          Desk is open source — contributions welcome.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets (clobber)."
            gh release upload "$TAG" "${ALL_FILES[@]}" --clobber
            gh release edit "$TAG" \
              --title "Desk ${TAG}" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            echo "Creating release $TAG with ${#ASSETS[@]} assets..."
            gh release create "$TAG" "${ALL_FILES[@]}" \
              --title "Desk ${TAG}" \
              --target "${{ github.sha }}" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi

          echo "Published: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          gh release view "$TAG" --json tagName,url,assets --jq '{tag: .tagName, url: .url, assets: [.assets[].name]}'
