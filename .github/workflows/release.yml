name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate tag format
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Manual run or non-tag event; skipping tag validation."
            exit 0
          fi
          TAG=${GITHUB_REF#refs/tags/}
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: tag '$TAG' does not match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "Release version: $TAG"
      - name: Verify version matches tag
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Manual run or non-tag event; skipping version check."
            exit 0
          fi
          TAG=${GITHUB_REF#refs/tags/}
          POM_VERSION=$(grep -m1 '<version>' pom.xml | head -1 | sed 's/.*<version>\([^<]*\)<\/version>.*/\1/' | tr -d ' ')
          if [ "$POM_VERSION" != "${TAG#v}"-SNAPSHOT ]; then
            echo "Warning: pom.xml version ($POM_VERSION) does not match tag ($TAG)."
            echo "         Expected: ${TAG#v}-SNAPSHOT"
          fi

  build-native:
    name: Build native artifacts
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK (GraalVM)
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '23'
          cache: maven
      - name: Install native-image component
        run: |
          if command -v native-image >/dev/null 2>&1; then
            native-image --version
          else
            gu install native-image || true
            native-image --version
          fi
      - name: Build all modules
        run: bash mvnw -B -DskipTests package
      - name: Build native image
        run: |
          GRAALVM_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
          export GRAALVM_HOME
          bash packaging/native-image/build-native.sh devkit
      - name: Normalize native artifact names
        run: |
          mkdir -p dist/upload
          for f in dist/native/devkit*; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            cp "$f" "dist/upload/${name}-${{ matrix.os }}"
          done
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: devkit-native-${{ matrix.os }}
          path: dist/upload/*
          retention-days: 90

  build-portable:
    name: Build portable runtime
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: Build all modules
        run: bash mvnw -B -DskipTests package
      - name: Build jlink portable distribution
        run: bash packaging/jlink/build-jlink.sh dist/devkit-portable
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: devkit-portable
          path: dist/devkit-portable/**
          retention-days: 90

  build-rust:
    name: Build Rust TUI editor
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust editor (release)
        working-directory: modules/devkit-editor-rs
        run: cargo build --release
      - name: Upload Rust binary
        uses: actions/upload-artifact@v4
        with:
          name: devkit-editor-rs-${{ matrix.os }}
          path: modules/devkit-editor-rs/target/release/devkit-editor-rs*
          retention-days: 90

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-native, build-portable, build-rust]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts
      - name: Generate checksums
        run: |
          cd dist/artifacts
          find . -type f ! -name '*.sha256' -print0 | while IFS= read -r -d '' f; do
            sha256sum "$f" > "${f}.sha256"
          done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/artifacts/**/*
          draft: false
          prerelease: false
