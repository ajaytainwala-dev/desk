name: Sync release links

# Keeps website/public/latest-release.json aligned with the newest GitHub Release
# so download buttons stay current even if the live API is rate-limited.
on:
  release:
    types: [published, edited]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: sync-release-links
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Update latest-release.json
    if: |
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'release'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Prefer the default branch so the site always tracks published assets.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Fetch latest release and write links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p website/public
          API="https://api.github.com/repos/${REPO}/releases/latest"
          HTTP=$(curl -sS -o /tmp/latest-release-api.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")
          if [[ "$HTTP" == "404" ]]; then
            echo "No published release yet — skipping sync."
            exit 0
          fi
          if [[ "$HTTP" != "200" ]]; then
            echo "GitHub API returned HTTP $HTTP" >&2
            cat /tmp/latest-release-api.json >&2 || true
            exit 1
          fi

          node <<'NODE'
          const fs = require("fs");
          const raw = JSON.parse(fs.readFileSync("/tmp/latest-release-api.json", "utf8"));

          const assets = (raw.assets || []).map((a) => ({
            name: a.name,
            url: a.browser_download_url,
            size: a.size,
          }));

          const pick = (patterns) => {
            for (const re of patterns) {
              const hit = assets.find((a) => re.test(a.name));
              if (hit) return { name: hit.name, url: hit.url, size: hit.size };
            }
            return null;
          };

          const downloads = {
            windows: {
              "windows-gui": pick([/^Desk-Setup-.*\.exe$/i]),
              "windows-cli": pick([/^desk-cli-setup-windows\.ps1$/i]),
              "portable-zip": pick([/^desk-portable-windows\.zip$/i, /^desk-portable\.zip$/i]),
              native: pick([/^desk-native-windows(\.exe)?$/i]),
              tui: pick([/^desk-tui-windows(\.exe)?$/i]),
            },
            macos: {
              "cli-setup": pick([/^desk-cli-setup\.sh$/i]),
              // Only a real macOS portable — never the Linux desk-portable.zip alias
              "portable-zip": pick([/^desk-portable-macos\.zip$/i]),
              native: pick([/^desk-native-macos$/i]),
              tui: pick([/^desk-tui-macos$/i]),
            },
            linux: {
              "cli-setup": pick([/^desk-cli-setup\.sh$/i]),
              "portable-zip": pick([/^desk-portable-linux\.zip$/i, /^desk-portable\.zip$/i]),
              native: pick([/^desk-native-linux$/i]),
              tui: pick([/^desk-tui-linux$/i]),
            },
          };

          // Drop null entries for a cleaner committed JSON.
          for (const platform of Object.keys(downloads)) {
            for (const kind of Object.keys(downloads[platform])) {
              if (!downloads[platform][kind]) delete downloads[platform][kind];
            }
          }

          const out = {
            updatedAt: new Date().toISOString(),
            tag: raw.tag_name,
            name: raw.name || raw.tag_name,
            publishedAt: raw.published_at,
            htmlUrl: raw.html_url,
            assets,
            downloads,
          };

          fs.writeFileSync(
            "website/public/latest-release.json",
            JSON.stringify(out, null, 2) + "\n",
          );
          console.log(`Wrote latest-release.json for ${out.tag} (${assets.length} assets)`);
          NODE

      - name: Commit updated release links
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/latest-release.json
          if git diff --staged --quiet; then
            echo "No release-link changes to commit."
            exit 0
          fi
          TAG=$(node -p "require('./website/public/latest-release.json').tag || 'latest'")
          git commit -m "chore(website): sync release links for ${TAG}"
          git push
